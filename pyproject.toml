[project]
name = "brep2code"
version = "0.1.0"
description = "Harness-first B-Rep to executable CAD script research implementation."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cadquery-ocp>=7.9,<8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
brep2code = "brep2code.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["brep2code*"]

[tool.setuptools.package-data]
brep2code = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = [
  "standard: credential-free tests that do not execute generated code",
  "integration: tests crossing package or filesystem boundaries",
  "e2e: complete offline user workflows",
]

[tool.ruff]
line-length = 100
target-version = "py312"
